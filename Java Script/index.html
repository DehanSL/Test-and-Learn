<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgb(0, 0, 0);
        }
        button{
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover{
            background-color: #45a049;
        }
        h1{
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1 id="header">Say Hi to java Script</h1>
    <button id="B1">Click</button>
    <script>
        let show = document.getElementById("B1");
        // show.addEventListener("click",()=>{
        //     console.log("Hello form java Script");
        // })


        show.addEventListener("click",()=>{
            document.getElementById("header").innerHTML = "I love you Madhu❤😘";
        })
    </script>
</body>
</html>
